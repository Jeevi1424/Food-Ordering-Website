<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login / Register - FoodRush</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo"><i class="fas fa-utensils"></i> FoodRush</a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="restaurants.html">Restaurants</a>
      </div>
    </div>
  </nav>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-logo"><i class="fas fa-utensils"></i> FoodRush</div>

      <!-- TABS -->
      <div class="auth-tabs">
        <button class="auth-tab active" id="loginTab" onclick="switchTab('login')">Login</button>
        <button class="auth-tab" id="registerTab" onclick="switchTab('register')">Register</button>
      </div>

      <!-- LOGIN FORM -->
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Email Address</label>
          <div class="input-icon">
            <i class="fas fa-envelope"></i>
            <input type="email" id="loginEmail" placeholder="you@example.com" required />
          </div>
        </div>
        <div class="form-group">
          <label>Password</label>
          <div class="input-icon">
            <i class="fas fa-lock"></i>
            <input type="password" id="loginPassword" placeholder="Your password" required />
            <button type="button" class="toggle-pw" onclick="togglePassword('loginPassword')">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>
        <div class="forgot-link"><a href="#">Forgot password?</a></div>
        <div class="form-error" id="loginError"></div>
        <button type="submit" class="btn-primary full-width">Login</button>
        <div class="or-divider"><span>or</span></div>
        <div class="role-login">
          <a href="owner-dashboard.html" class="btn-outline" onclick="setDemoOwner()">
            <i class="fas fa-store"></i> Login as Restaurant Owner
          </a>
          <a href="admin.html" class="btn-outline" onclick="setDemoAdmin()">
            <i class="fas fa-shield-alt"></i> Login as Admin
          </a>
        </div>
      </form>

      <!-- REGISTER FORM -->
      <form id="registerForm" style="display:none;" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label>Full Name</label>
          <div class="input-icon">
            <i class="fas fa-user"></i>
            <input type="text" id="regName" placeholder="John Doe" required />
          </div>
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <div class="input-icon">
            <i class="fas fa-envelope"></i>
            <input type="email" id="regEmail" placeholder="you@example.com" required />
          </div>
        </div>
        <div class="form-group">
          <label>Phone Number</label>
          <div class="input-icon">
            <i class="fas fa-phone"></i>
            <input type="tel" id="regPhone" placeholder="+1 234 567 8900" />
          </div>
        </div>
        <div class="form-group">
          <label>Password</label>
          <div class="input-icon">
            <i class="fas fa-lock"></i>
            <input type="password" id="regPassword" placeholder="Min. 6 characters" required />
            <button type="button" class="toggle-pw" onclick="togglePassword('regPassword')">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>
        <div class="form-group">
          <label>I am a</label>
          <select id="regRole">
            <option value="customer">Customer</option>
            <option value="owner">Restaurant Owner</option>
          </select>
        </div>
        <div class="form-error" id="registerError"></div>
        <button type="submit" class="btn-primary full-width">Create Account</button>
      </form>

    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
